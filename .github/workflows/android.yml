name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      apiUrl:
        description: "Backend URL the APK should talk to (blank = use repo variable)"
        required: false

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to publish the APK to Releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # Points the packaged app at the deployed backend.
          # Set repo variable VITE_API_URL to e.g. https://omogusii-api.onrender.com
          VITE_API_URL: ${{ github.event.inputs.apiUrl || vars.VITE_API_URL || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/omogusii-${GITHUB_REF_NAME}-$(git rev-parse --short HEAD).apk"
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omogusii-debug-apk
          path: out/*.apk
          retention-days: 30

      # Phone-friendly: a bare .apk in Releases installs straight from the
      # Downloads folder — no unzipping, no computer.
      - name: Publish APK to rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/*.apk \
            --title "Omogusii APK — $(date -u '+%d %b %Y, %H:%M') UTC" \
            --notes "Debug build of ${GITHUB_REF_NAME}@$(git rev-parse --short HEAD). Android 6.0+. Download the .apk and open it." \
            --prerelease

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
